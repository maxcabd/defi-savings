[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "defi-savings"
version = "0.4.0"
description = "On-chain yield layer: deposit USDC into Aave, Morpho, or any ERC-4626 vault"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["defi", "aave", "morpho", "erc4626", "savings", "web3", "gnosis-safe", "fintech"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "web3>=7.0",
    "eth-account>=0.13",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Repository = "https://github.com/maxcabd/defi-savings"
Issues     = "https://github.com/maxcabd/defi-savings/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/defi_savings"]

[tool.pytest.ini_options]
testpaths = ["tests"]
